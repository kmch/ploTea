# A development environment: conda for the compiled geospatial stack, pip for plotea itself.
#
#   conda env create -f environment.yml && conda activate plotea
#
# conda-forge comes first deliberately. GDAL, PROJ and GEOS are shared libraries, and mixing
# conda-forge builds with defaults' builds of the same stack is how an import starts failing
# with a version mismatch nobody can trace.
name: plotea
channels:
  - conda-forge
dependencies:
  - python>=3.11          # plotea/log.py reads code.co_qualname
# Core
  - matplotlib>=3.9,<4
  - numpy
  - pandas
# Geospatial
  - cartopy>=0.23
  - geopandas>=1.0
  - rasterio
  - rioxarray
  - shapely
  - xarray
# Notebooks
  - ipykernel
  - jupyterlab
# Tests
  - pytest
  - pytest-cov
# Docs
  - myst-nb
  - myst-parser
  - pydata-sphinx-theme
  - sphinx
  - sphinx-design
  - pip
  - pip:
      - healpix-geo                # the HEALPix DGGS layer: indexing on WGS84
      - healpix-plot>=2026.7       # and its rasteriser; see the dggs extra in pyproject
      - -e .
