[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plotea"
version = "0.1.0"
description = "Publication-quality maps: rasters, vectors, swaths and the HEALPix DGGS."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kajetan Chrapkiewicz"}]

# matplotlib is capped below 4 because plotea/maps/carto.py hooks
# _AxesBase._set_artist_props, which is private API and may move in a major release.
# requires-python >=3.11 is set by plotea/log.py, which reads code.co_qualname.
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy",
    "pandas",
    "cartopy>=0.23",
    "geopandas>=1.0",
    "xarray",
    "rioxarray",
    "rasterio",
    "shapely",
]

[project.optional-dependencies]
# The HEALPix layer is the one part with dependencies of its own, and it is the one part a
# map-only install has no use for. healpix-plot has a floor because its API moved: it spells
# the colorbar keyword `colorbar` where an earlier release spelt it `cbar`, and 2026.7 is the
# version this is tested against.
dggs = ["healpix-geo", "healpix-plot>=2026.7"]
dev = ["pytest", "pytest-cov"]
# ipykernel and the dggs extra because the docs execute notebooks/plotea.ipynb, and one of
# its sections draws the HEALPix grid.
docs = ["sphinx", "myst-parser", "pydata-sphinx-theme", "sphinx-design", "myst-nb",
        "ipykernel", "plotea[dggs]"]

[project.urls]
Homepage = "https://github.com/kmch/plotea"

[tool.setuptools.packages.find]
include = ["plotea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
