[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plotea"
version = "0.1.0"
description = "Publication-quality scientific figures: maps, graphs, time series and volumes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kajetan Chrapkiewicz"}]

# matplotlib is capped below 4 because plotea/maps/carto.py will hook
# _AxesBase._set_artist_props, which is private API (see PLAN.md, risk 1).
# requires-python >=3.11 is set by plotea/log.py, which reads code.co_qualname.
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy",
    "pandas",
    "cartopy>=0.23",
    "geopandas>=1.0",
    "xarray",
    "rioxarray",
    "rasterio",
    "shapely",
    "pyproj",
]

[project.optional-dependencies]
# The HEALPix layer is the one part with dependencies of its own, and it is the one part a
# map-only install has no use for.
dggs = ["healpix-geo", "healpix-plot"]
dev = ["pytest", "pytest-cov"]
docs = ["sphinx", "myst-parser", "pydata-sphinx-theme", "sphinx-design", "myst-nb"]

[project.urls]
Homepage = "https://github.com/kmch/plotea"

[tool.setuptools.packages.find]
include = ["plotea*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
